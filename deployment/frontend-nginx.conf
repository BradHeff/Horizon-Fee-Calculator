# Merge into the FRONTEND site's HTTPS server block in CloudPanel.
# Replace the existing location / block; do not duplicate it.
location / {
    try_files $uri $uri/ /index.html;
}

# Keep API paths and query strings intact. Cookies belong to the frontend host.
location ^~ /api/ {
    proxy_pass https://fees-api.horizon.sa.edu.au;
    proxy_set_header Host fees-api.horizon.sa.edu.au;
    proxy_set_header Origin $http_origin;
    proxy_ssl_server_name on;
    proxy_ssl_name fees-api.horizon.sa.edu.au;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_cache off;
    proxy_read_timeout 30s;
}
